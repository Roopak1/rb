<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blank White Screen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Pre-Start Overlay -->
    <div id="pre-start-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #F2F0EF; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 24px; padding: 0 30px; text-align: center;">
        <div style="font-size: 2.2rem; color: #171717; font-weight: 500;">For the best experience</div>
        <p style="font-size: 1.2rem; color: #171717; opacity: 0.8; max-width: 450px; margin: 0; line-height: 1.5;">Please turn your phone sideways (landscape mode) and make sure rotation lock is off. When you're ready, click the button below to start.</p>
        <button id="start-fullscreen-btn" style="padding: 14px 28px; font-size: 1.2rem; background: #171717; color: #F2F0EF; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 500; transition: transform 0.2s ease; margin-top: 10px;">Enter Fullscreen & Start</button>
    </div>
    <!-- Fullscreen Button -->
    <div class="fs-btn-wrapper" id="fs-btn-wrapper">
        <button class="icon-btn" id="fs-btn" aria-label="Fullscreen">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
    </div>


    <!-- Background Diffusion Layer -->
    <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; overflow: hidden; z-index: 0;">
        <div class="color-ball ball-green" id="ball-1"></div>
        <div class="color-ball ball-blue" id="ball-2"></div>
        <div class="color-ball ball-pink" id="ball-3"></div>
        <div class="color-ball ball-teal" id="ball-4"></div>
        <div class="color-ball ball-purple" id="ball-5"></div>
    </div>
    <div class="screen-wrapper" style="position: relative; z-index: 10;">
        <!-- The final text overlays perfectly aligned with the numbers -->
        <div class="reveal-wrapper" id="final-text-wrapper"
            style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 100vw; display: flex; justify-content: center; pointer-events: none;">
            <div class="final-text" id="final-text">
                <div class="time-group">
                    <span class="final-num" id="final-days">00</span>
                    <span class="final-word">days</span>
                </div>
                <div class="time-group">
                    <span class="final-num" id="final-hours">00</span>
                    <span class="final-word">hours</span>
                </div>
                <div class="time-group">
                    <span class="final-num" id="final-minutes">00</span>
                    <span class="final-word">minutes</span>
                </div>
                <div class="time-group">
                    <span class="final-num" id="final-seconds">00</span>
                    <span class="final-word">seconds</span>
                </div>
            </div>
        </div>
        <div class="scene-container">
            <div class="reveal-wrapper">
                <div class="number" id="num-left">02</div>
            </div>

            <div class="center-group">
                <div class="text-wrapper" id="text-wrap">
                    <div class="reveal-wrapper">
                        <div class="story-text" id="center-text">The story begins</div>
                    </div>
                </div>
                <div class="colon">:</div>
            </div>

            <div class="reveal-wrapper">
                <div class="number" id="num-right">06</div>
            </div>
        </div>

        <div class="reveal-wrapper" style="position: relative; width: 100vw; justify-content: center;">
            <div class="subtitle-text">when it all began</div>
            <div class="days-text" id="days-text"
                style="position: absolute; top: 0; left: 0; width: 100%; text-align: center;">days</div>
            <div class="days-text" id="hours-text"
                style="position: absolute; top: 0; left: 0; width: 100%; text-align: center; opacity: 0; transform: translateY(1.5em);">
                hours</div>
            <div class="days-text" id="minutes-text"
                style="position: absolute; top: 0; left: 0; width: 100%; text-align: center; opacity: 0; transform: translateY(1.5em);">
                minutes</div>
            <div class="days-text" id="seconds-text"
                style="position: absolute; top: 0; left: 0; width: 100%; text-align: center; opacity: 0; transform: translateY(1.5em);">
                seconds</div>
        </div>

        <div class="reveal-wrapper"
            style="position: absolute; bottom: 0; width: 100vw; justify-content: center; pointer-events: none;">
            <div class="final-subtitle" id="final-subtitle">The story continues</div>
        </div>
    </div>



    <script src="app.js"></script>
</body>

</html>
